name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, dependency audit, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel_ci_password
          POSTGRES_DB: lvyoutong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d lvyoutong_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm
        run: npm install --global npm@11.6.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high --fetch-timeout=60000 --fetch-retries=1
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm test
      - name: Validate PostgreSQL migration
        env:
          DATABASE_URL: postgresql://travel:travel_ci_password@localhost:5432/lvyoutong_test
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_initial_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) = 10 AS expected_core_tables FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" | grep -q t
      - name: Type check and production build
        run: npm run build
      - name: Verify GitHub Pages asset base path
        run: grep -q 'src="/lvyoutong/assets/' dist/index.html
      - name: Upload versioned GitHub Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
